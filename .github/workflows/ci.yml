name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://example.invalid/api/v1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devtrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: frontend
      - uses: actions/checkout@v7
        with:
          repository: game227/devtrack-backend
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies and migrate
        working-directory: backend
        env:
          SECRET_KEY: e2e-only-not-a-secret
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/devtrack
        run: |
          pip install -r requirements.txt
          echo "FIELD_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          python manage.py migrate --noinput
      - name: Run the backend server
        working-directory: backend
        env:
          SECRET_KEY: e2e-only-not-a-secret
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/devtrack
        run: nohup python manage.py runserver 127.0.0.1:8000 --noreload > ../backend.log 2>&1 &

      - name: Install frontend dependencies and Playwright's browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the frontend dev server
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
        run: nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../frontend.log 2>&1 &

      - name: Wait for both servers to be ready
        run: |
          for url in http://localhost:8000/api/v1/health/ http://localhost:5173; do
            for i in $(seq 1 30); do
              curl -sf "$url" > /dev/null && break
              sleep 1
              if [ "$i" = 30 ]; then echo "Timed out waiting for $url"; cat backend.log frontend.log; exit 1; fi
            done
          done

      - name: Run Playwright
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npm run test:e2e

      - name: Upload logs and the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            backend.log
            frontend.log
            frontend/playwright-report/
