<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Set the theme before first paint so a light-theme user never sees a dark flash.
      // Keep in step with lib/theme.ts (same storage key, same default).
      try {
        var pref = localStorage.getItem('devtrack_theme')
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
        var theme = pref === 'light' || pref === 'dark' ? pref : pref === 'system' ? (dark ? 'dark' : 'light') : 'dark'
        document.documentElement.dataset.theme = theme
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <meta name="description" content="DevTrack — project management for developers: kanban boards, project health, GitHub-aware progress. Uzbek and English." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600&family=Playfair+Display:wght@400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>DevTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
