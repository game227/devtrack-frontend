<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cececc" />
    <script>
      // Set the theme before first paint so a light-theme user never sees a dark flash.
      // Keep in step with lib/theme.ts (same storage key, same default).
      try {
        var pref = localStorage.getItem('devtrack_theme')
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
        var theme = pref === 'light' || pref === 'dark' ? pref : pref === 'system' ? (dark ? 'dark' : 'light') : 'light'
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#151515')
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <meta name="description" content="DevTrack is an issue tracker for small development teams: every issue rides one line from backlog to done, and GitHub commits move it along. In Uzbek, Russian and English." />
    <title>DevTrack — every task on one line</title>
    <!-- Link previews (Telegram, Slack, X...). Absolute URLs: change them with the production domain. -->
    <link rel="canonical" href="https://devtrack-frontend.onrender.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevTrack" />
    <meta property="og:title" content="DevTrack — every task on one line" />
    <meta property="og:description" content="An issue tracker for small development teams. GitHub commits move issues along; in Uzbek, Russian and English." />
    <meta property="og:url" content="https://devtrack-frontend.onrender.com/" />
    <meta property="og:image" content="https://devtrack-frontend.onrender.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DevTrack: every task on one line. Always in view." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
